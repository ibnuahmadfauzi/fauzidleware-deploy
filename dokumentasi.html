<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fauzidleware | Dokumentasi</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts: Space Grotesk -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Memanggil Global CSS milik Anda -->
    <link rel="stylesheet" href="/css/style.css" />

    <style>
      /* --- STYLES KHUSUS HALAMAN DOKUMENTASI --- */
      .page-header {
        padding: 80px 0 60px;
        background-color: var(--accent-green);
        border-bottom: var(--border-thick);
        background-image:
          radial-gradient(#111 15%, transparent 16%),
          radial-gradient(#111 15%, transparent 16%);
        background-size: 40px 40px;
        background-position:
          0 0,
          20px 20px;
      }

      .header-box {
        background-color: #fff;
        padding: 2rem;
        display: inline-block;
        transform: rotate(2deg);
        box-shadow: 10px 10px 0 #111;
      }

      .galeri-section {
        padding: 60px 0 100px;
        background-color: #fff;
      }

      /* Foto Card Neobrutalism */
      .foto-card {
        background-color: #fff;
        border: var(--border-thick);
        box-shadow: 6px 6px 0 #111;
        transition: all 0.2s ease-in-out;
        cursor: pointer; /* Memberi tahu user ini bisa diklik */
        overflow: hidden;
        position: relative;
      }

      .foto-card:hover {
        transform: translate(3px, 3px);
        box-shadow: 3px 3px 0 #111;
        border-color: var(--accent-yellow);
      }

      .foto-img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        filter: grayscale(30%);
        transition:
          filter 0.3s,
          transform 0.3s;
      }

      .foto-card:hover .foto-img {
        filter: grayscale(0%);
        transform: scale(1.05);
      }

      /* Modal Lightbox Brutalism */
      .modal-content.brutal-modal {
        border: var(--border-thick);
        border-radius: 0;
        box-shadow: 10px 10px 0 #111;
        background-color: #fff;
      }
      .btn-close-brutal {
        background-color: var(--accent-yellow);
        border: 2px solid #111;
        opacity: 1;
        box-shadow: 2px 2px 0 #111;
        transition: all 0.2s;
        position: absolute;
        top: -15px;
        right: -15px;
        z-index: 1050;
        padding: 10px;
      }
      .btn-close-brutal:hover {
        background-color: #ff4d4d;
        transform: translate(2px, 2px);
        box-shadow: 0px 0px 0 #111;
      }
    </style>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg sticky-top"></nav>

    <!-- PAGE HEADER -->
    <header class="page-header text-center">
      <div class="container">
        <div class="header-box brutal-border">
          <h1 class="display-4 fw-bold mb-0">DOKUMENTASI</h1>
        </div>
        <div class="mt-4">
          <p
            class="fs-5 fw-bold bg-white d-inline-block px-4 py-2 brutal-border"
            style="box-shadow: 4px 4px 0 #111"
          >
            Jejak Visual Perjalanan dan Pengalaman
          </p>
        </div>
      </div>
    </header>

    <!-- GALERI SECTION -->
    <section class="galeri-section">
      <div class="container">
        <!-- Wadah Accordion agar per section dimuat terpisah -->
        <div class="accordion brutal-accordion" id="dokumentasiAccordion">
          <!-- Data akan di-inject ke sini oleh script -->
        </div>
      </div>
    </section>

    <!-- ============================================== -->
    <!-- MODAL LIGHTBOX UNTUK PERBESAR FOTO             -->
    <!-- ============================================== -->
    <div class="modal fade" id="modalFoto" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content brutal-modal position-relative">
          <button
            type="button"
            class="btn-close btn-close-brutal"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
          <div class="modal-body p-2 bg-dark">
            <img
              src=""
              id="lightbox-img"
              class="w-100"
              style="max-height: 80vh; object-fit: contain"
              alt="Gambar diperbesar"
            />
          </div>
          <div
            class="modal-footer justify-content-center bg-white border-top border-dark border-3 py-3"
          >
            <h5
              class="mb-0 fw-bold font-monospace text-center"
              id="lightbox-caption"
            >
              Caption Foto
            </h5>
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer"></footer>

    <!-- Bootstrap Bundle & jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Memanggil File Data Dokumentasi Anda -->
    <script src="/utils/data-dokumentasi.js"></script>
    <script src="/js/script.js"></script>

    <script>
      $(document).ready(function () {
        let accordionHTML = "";

        // 1. Looping Kategori/Section untuk membuat struktur Accordion
        dataDokumentasi.forEach((section, index) => {
          let isExpanded = index === 0 ? "true" : "false";
          let showClass = index === 0 ? "show" : "";
          let collapsedClass = index === 0 ? "" : "collapsed";

          // Bungkus foto dalam section
          accordionHTML += `
                <div class="accordion-item bg-white mb-4 brutal-border brutal-shadow">
                    <h2 class="accordion-header" id="heading-${section.id}">
                        <button class="accordion-button ${collapsedClass} fw-bold fs-4 bg-yellow-brutal border-bottom border-dark border-3 py-3" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-${section.id}" aria-expanded="${isExpanded}" aria-controls="collapse-${section.id}">
                            📁 ${section.title}
                        </button>
                    </h2>
                    <div id="collapse-${section.id}" class="accordion-collapse collapse ${showClass}" aria-labelledby="heading-${section.id}" data-bs-parent="#dokumentasiAccordion">
                        <div class="accordion-body p-4">
                            <p class="fs-5 mb-4 text-dark fw-semibold">${section.description}</p>
                            
                            <!-- Grid Foto -->
                            <div class="row g-4">
                                ${section.photos
                                  .map(
                                    (photo) => `
                                    <div class="col-sm-6 col-md-4 col-lg-3">
                                        <div class="foto-card" data-bs-toggle="modal" data-bs-target="#modalFoto" data-src="${photo.src}" data-caption="${photo.caption}">
                                            <img src="${photo.src}" alt="${photo.alt}" class="foto-img" loading="lazy">
                                        </div>
                                    </div>
                                `,
                                  )
                                  .join("")}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });

        // 2. Suntikkan ke dalam accordion container
        $("#dokumentasiAccordion").html(accordionHTML);

        // 3. Logika Modal Lightbox
        $("#modalFoto").on("show.bs.modal", function (event) {
          var trigger = $(event.relatedTarget);
          var srcGambar = trigger.data("src");
          var captionGambar = trigger.data("caption");

          var modal = $(this);
          modal.find("#lightbox-img").attr("src", srcGambar);
          modal.find("#lightbox-caption").text(captionGambar);
        });
      });
    </script>
  </body>
</html>
